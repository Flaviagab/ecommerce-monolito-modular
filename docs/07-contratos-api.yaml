openapi: 3.0.3
info:
  title: E-commerce API
  version: 1.0.0
  description: Contrato inicial da API do monólito modular.
servers:
  - url: http://localhost:3000
tags:
  - name: Catalogo
  - name: Carrinho
  - name: Checkout
  - name: Pagamentos
  - name: Usuarios
paths:
  /v1/catalogo/produtos:
    get:
      tags: [Catalogo]
      summary: Lista produtos
      responses:
        '200':
          description: Lista retornada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}
  /v1/carrinho/items:
    post:
      tags: [Carrinho]
      summary: Adiciona produto ao carrinho
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, productId, qty]
              properties:
                userId: {type: string, format: uuid}
                productId: {type: string, format: uuid}
                qty: {type: integer, minimum: 1}
      responses:
        '201': {description: Item adicionado}
        '400': {description: Dados inválidos}
        '501': {description: Caso de uso ainda não implementado}
  /v1/carrinho/items/{itemId}:
    delete:
      tags: [Carrinho]
      summary: Remove item do carrinho
      parameters:
        - in: path
          name: itemId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Item removido}
        '404': {description: Item não encontrado}
        '501': {description: Caso de uso ainda não implementado}
  /v1/checkout:
    post:
      tags: [Checkout]
      summary: Gera pedido a partir do carrinho
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: {type: string, format: uuid}
      responses:
        '201': {description: Pedido criado}
        '400': {description: Carrinho inválido ou vazio}
        '501': {description: Caso de uso ainda não implementado}
  /v1/pagamentos:
    post:
      tags: [Pagamentos]
      summary: Processa pagamento simulado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: {type: string, format: uuid}
      responses:
        '200': {description: Resultado do pagamento simulado}
        '404': {description: Pedido não encontrado}
        '501': {description: Caso de uso ainda não implementado}
  /v1/usuarios/signup:
    post:
      tags: [Usuarios]
      summary: Cadastra usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 8, format: password}
      responses:
        '201': {description: Usuário cadastrado}
        '409': {description: E-mail já cadastrado}
        '501': {description: Caso de uso ainda não implementado}
  /v1/usuarios/login:
    post:
      tags: [Usuarios]
      summary: Autentica usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200': {description: Autenticação realizada}
        '401': {description: Credenciais inválidas}
        '501': {description: Caso de uso ainda não implementado}
components:
  schemas:
    Product:
      type: object
      required: [id, name, sku, price, stock]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        sku: {type: string}
        price: {type: number, format: float}
        stock: {type: integer}
